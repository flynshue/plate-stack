# This is an example .goreleaser.yml file with some sane defaults.
# Make sure to check the documentation at http://goreleaser.com
version: 2
project_name: plate-stack #Name of your project, should match name of github repo
before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    id: plate-stack # same as project name
dockers:
  - use: buildx
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.snapshot={{ .IsSnapshot }}"
      - "--platform=linux/amd64"
    dockerfile: ./Dockerfile
    goos: linux
    ids:
      - plate-stack # same as project name
    image_templates:
      # Change this to your container registry
      - 'public.ecr.aws/flynshue/plate-stack:{{ if .IsSnapshot }}{{ .Tag }}-{{ .ShortCommit }}{{ else }}{{ .Tag }}{{ end }}-amd64'
    extra_files:
    - views
  - use: buildx
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.snapshot={{ .IsSnapshot }}"
      - "--platform=linux/arm64"
    dockerfile: ./Dockerfile
    goos: linux
    ids:
      - plate-stack # same as project name
    image_templates:
      # Change this to your container registry
      - 'public.ecr.aws/flynshue/plate-stack:{{ if .IsSnapshot }}{{ .Tag }}-{{ .ShortCommit }}{{ else }}{{ .Tag }}{{ end }}-arm64'
    extra_files:
    - views
